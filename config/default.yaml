# ============================================================
# AAAAI —— 多智能体自动资产投研框架，默认配置
#
# 说明：
# - 绝大多数设置可在 WebUI 中修改并即时生效（见「策略/风控/模型管理」页）；
#   本文件是启动兜底，WebUI 的「写入配置文件」会覆盖此文件。
# - 密钥从不写进本文件：LLM 密钥读环境变量（llm.api_key_env 指定名字），
#   交易所与模型密钥在 WebUI 配置，存于 data/secrets.json（0600，已 gitignore）。
# ============================================================

app:
  name: AAAAI
  log_level: info            # debug | info | warn | error

server:
  host: 0.0.0.0
  port: 8787                 # WebUI / API 端口

# 可选鉴权：留空 = 不启用。启用后可用 AAAAI_AUTH_USERNAME/PASSWORD 登录面板，
# 或用 AAAAI_AUTH_TOKEN 走 Authorization: Bearer <token>
auth:
  enabled: false
  username: ""               # 默认登录用户名
  session_ttl_hours: 12      # 会话有效期

market:
  symbols: []                # 留空 = 使用「自选标的」页的列表
  interval: 1m               # K 线周期：1m/5m/15m/30m/1h/4h/1d
  bar_count: 200             # 回测/实时预热的 K 线根数
  poll_ms: 15000             # 实时模式轮询间隔（毫秒）

llm:
  # 已由 strategy.decision_source 取代，此项仅用于兼容旧配置迁移
  enabled: false
  provider: openai-compatible
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  model: gpt-4o-mini
  temperature: 0.2
  timeout_ms: 20000
  decision_interval: 10      # 每隔多少根 K 线请求一次模型（限流/控费）
  strategy: round-robin      # 多实例负载均衡：round-robin | weighted | random | latency

strategy:
  # 智能体决策来源（三选一），WebUI「策略」页顶部可随时切换
  #   rules      = 纯规则，双均线动量本地计算，不调用模型
  #   chat       = 对话模型池（OpenAI 兼容大模型）
  #   systemone  = System One 决策模型池（Jev / Laya / 阿里云百炼）
  # 混合决策：decision_sources 列出参与决策的路，blend 给各路配比（0 = 不参与）
  #   ["rules"]                    = 只用规则
  #   ["chat"]                     = 只用对话模型
  #   ["chat","systemone"]         = 对话模型 + System One 按配比融合（推荐）
  #   ["rules","chat","systemone"] = 三路融合
  decision_sources: [rules]
  blend:
    rules: 1
    chat: 0
    systemone: 0
  decision_source: rules
  name: llm-momentum         # momentum = 纯动量 | llm-momentum = 模型决策+动量兜底
  fast_window: 5             # 快线窗口
  slow_window: 20            # 慢线窗口（须大于快线）
  max_target_weight: 0.5     # 逐标的模式下单个标的的目标仓上限（占总权益）
  # 资产配置：让 AI/规则在「候选池」里自己选标的、配权重（关闭 = 人指定标的，模型只定仓位）
  self_allocating: false
  max_positions: 3           # 最多同时持有几个资产
  max_gross_exposure: 1.0    # 组合总仓位上限（各权重之和），其余留现金
  allocation_interval: 5     # 每 N 轮行情做一次资产配置

risk:
  initial_cash: 100000       # 初始资金
  fee_rate: 0.0003           # 模拟手续费率
  slippage_bps: 2            # 模拟滑点（基点）
  max_order_value: 20000     # 单笔下单金额上限
  max_position_weight: 0.6   # 单标的仓位上限
  min_trade_value: 0         # 最小调仓额：低于此金额不下单（0 = 不限制，用于过滤噪声微调）
  max_drawdown_pct: 0.15     # 组合回撤熔断线（实时模式触发即停机）

execution:
  mode: paper                # paper = 本地模拟成交 | live = 交易所真实下单（危险）
  connection_id: ""          # 行情/交易使用的连接 ID，留空用第一个连接
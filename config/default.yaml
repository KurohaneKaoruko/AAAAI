# ============================================================
# AAAAI —— 多智能体自动资产投研框架，全局配置
# 提示：绝大多数设置可在 WebUI 中修改并即时生效，
#       本文件仅作为默认值与启动兜底。密钥在 WebUI「交易所」页配置，
#       存入 data/secrets.json（0600，已被 .gitignore 忽略）。
# ============================================================

app:
  name: AAAAI
  log_level: info            # debug | info | warn | error

server:
  host: 0.0.0.0
  port: 8787                 # WebUI / API 端口

market:
  symbols: []                # 留空 = 使用「自选标的」页的列表
  interval: 1m               # K 线间隔：1m/5m/15m/30m/1h/4h/1d
  bar_count: 200             # 回测/实时预热的 K 线根数
  poll_ms: 15000             # 实时模式轮询间隔（毫秒）

llm:
  enabled: false             # true = 启用 LLM 决策（需 OPENAI_API_KEY）
  provider: openai-compatible
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  model: gpt-4o-mini
  temperature: 0.2
  timeout_ms: 20000
  decision_interval: 10      # 每隔多少根 K 线请求一次 LLM（限流/控费）

strategy:
  name: llm-momentum         # llm-momentum = LLM 决策+动量兜底 | momentum = 纯规则
  fast_window: 5
  slow_window: 20
  max_target_weight: 0.5     # 策略目标仓上限（占总权益）

risk:
  initial_cash: 100000       # 初始资金
  fee_rate: 0.0003           # 模拟手续费率
  slippage_bps: 2            # 模拟滑点（基点）
  max_order_value: 20000     # 单笔下单金额上限
  max_position_weight: 0.6   # 单标的仓位上限
  max_drawdown_pct: 0.15     # 组合回撤熔断线（实时模式触发即停机）

execution:
  mode: paper                # paper = 本地模拟成交 | live = 交易所真实下单（危险）
  connection_id: ""          # 行情/交易使用的连接 ID，留空用第一个连接